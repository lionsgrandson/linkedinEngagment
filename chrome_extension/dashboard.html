<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeCrafter Social Statistics</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#f8fafc}body{margin:0;padding:28px}main{max-width:960px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:24px}.card{padding:20px;border:1px solid #334155;border-radius:14px;background:#0f172a}.card strong{display:block;font-size:28px;margin-top:8px}.status{margin-top:20px;padding:14px;border-radius:12px;background:#172033}.status[data-phase=loading]{animation:pulse 1s infinite}.status[data-phase=success]{border:1px solid #22c55e}.status[data-phase=failure]{border:1px solid #ef4444}.status[data-phase=blank]{border:1px solid #64748b}button{margin-top:20px;padding:11px 16px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.15);transform:translateY(-1px)}@keyframes pulse{50%{opacity:.45}}
  </style>
</head>
<body><main><header><div><p>CodeCrafter Social Bridge</p><h1>Browser statistics</h1></div><span id="version"></span></header><section id="status" class="status" data-phase="loading">Loading browser activity…</section><section id="metrics" class="grid" aria-busy="true"></section><button id="refresh" type="button">Refresh</button></main><script src="dashboard.js"></script></body>
</html>
